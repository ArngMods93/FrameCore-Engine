name: Build Android

on:
  push:
    branches:
      - main
      - experimental
      - patch-1
  pull_request:
    branches:
      - main
      - experimental
      - patch-1
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.6
  JAVA_VERSION: "21"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxe libraries
        run: |
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      - name: Configure SScript
        run: |
          echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Configure Android toolchain
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build
        run: |
          haxelib run lime build Project.xml android -D officialBuild

      - name: Show build output on failure
        if: failure()
        run: |
          find export/release/android/bin -type f 2>/dev/null || true

      - name: Upload Android build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameCore-Android
          path: |
            export/release/android/bin/app/build/outputs/apk/**/*.apk
            export/release/android/bin/**/*.apk
          if-no-files-found: error
